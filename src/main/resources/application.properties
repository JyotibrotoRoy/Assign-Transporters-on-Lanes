spring.application.name=transporter-assignment

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/freightfox_assignment}
spring.datasource.username=${DB_USERNAME:freightfox}
spring.datasource.password=${DB_PASSWORD:local_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration